name: Android quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android 17 SDK
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-37.0"
          "build-tools;37.0.0"

      - name: Test, lint, and build
        run: |
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace || {
            find app/build -name lint-results-debug.txt -exec cat {} \;
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-mode-context-os-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
